<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开场对比 · CSS 3D / Three.js</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0e0e10;color:#f3efe6;font:14px/1.5 'Noto Sans SC','Microsoft YaHei',sans-serif}
header{height:112px;padding:17px 24px;border-bottom:1px solid #363335}header nav{display:flex;gap:10px;align-items:center}a{color:inherit}header p{margin:12px 0 0;color:#c1b9ae;font-size:13px}
button{background:#292427;color:#f3efe6;border:1px solid #726256;padding:9px 16px;cursor:pointer}button:hover{background:#60352a}button:focus-visible{outline:2px solid #e6815f}.grid{position:absolute;inset:112px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}.pane{min-width:0;display:grid;grid-template-rows:44px 1fr}.label{padding:10px 16px;display:flex;justify-content:space-between;background:#191719}iframe{width:100%;height:100%;border:0}.label span{color:#c48067}header b{margin-right:18px;color:#e49676}
</style></head>
<body>
<header><nav><a href="index.html">← 实验室</a><b>同一内容，两种开场</b><button data-command="go">同步推进 Enter</button><button data-command="back">同步返回 ↑</button><button data-command="replay">同步重放 R</button></nav>
<p>两版共用文字、构图、镜头路径和时长；Three.js 版额外演示雾、发光尘埃与空间细线。本页用于看效果，不用于比较 FPS。点击任一画面后，快捷键仍同步两侧。</p></header>
<div class="grid"><section class="pane"><div class="label"><span>01 / DOM + CSS 3D</span><a href="dom/index.html">单独全屏查看 ↗</a></div><iframe id="a" title="CSS 3D 开场" src="dom/index.html?embed=1"></iframe></section>
<section class="pane"><div class="label"><span>02 / THREE.JS + WEBGL</span><a href="three/index.html">单独全屏查看 ↗</a></div><iframe id="b" title="Three.js 开场" src="three/index.html?embed=1"></iframe></section></div>
<script>
const frames=[document.getElementById('a'),document.getElementById('b')];
function send(command){frames.forEach(f=>{
  f.contentWindow.postMessage({type:'opener-command',command},'*');
  try { f.contentWindow.TEST_PLAYER?.[command==='go'?'go':command==='back'?'go':'setProgress'](command==='go'?1:command==='back'?0:0); } catch (_) {}
});}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.dataset.command));
addEventListener('keydown',e=>{if(e.target.closest('button,a'))return;const cmd={Enter:'go',' ':'go',ArrowRight:'go',Backspace:'back',ArrowUp:'back',r:'replay',R:'replay'}[e.key];if(cmd){e.preventDefault();if(!e.repeat)send(cmd);}});
addEventListener('message',e=>{if(e.data?.type==='opener-command' && ['go','back','replay'].includes(e.data.command))send(e.data.command);});
</script></body></html>
