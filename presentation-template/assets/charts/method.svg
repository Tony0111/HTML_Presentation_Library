<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-label="合成方法示意图，展示从定义范围到形成判断的四个阶段">
  <rect width="1160" height="620" fill="#f3efe6"/>
  <g font-family="Georgia, 'Noto Serif SC', serif" fill="#161415">
    <text x="60" y="60" font-size="26" font-style="italic" fill="#b8452e">METHOD / ILLUSTRATIVE</text>
    <text x="60" y="98" font-size="17" font-family="'Source Han Sans SC','Microsoft YaHei',sans-serif" fill="#6f6a63">从问题到阅读：四个可被跟上的步骤</text>
  </g>
  <g stroke="#b8452e" stroke-width="2" fill="none">
    <path d="M180 300 H 980"/>
  </g>
  <g fill="#f3efe6" stroke="#b8452e" stroke-width="2">
    <circle cx="180" cy="300" r="14"/>
    <circle cx="447" cy="300" r="14"/>
    <circle cx="713" cy="300" r="14"/>
    <circle cx="980" cy="300" r="14"/>
  </g>
  <g fill="#b8452e" font-family="Georgia, serif" font-style="italic" font-size="22" text-anchor="middle">
    <text x="180" y="248">01</text>
    <text x="447" y="248">02</text>
    <text x="713" y="248">03</text>
    <text x="980" y="248">04</text>
  </g>
  <g font-family="'Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="26" fill="#161415" text-anchor="middle">
    <text x="180" y="368">定义范围</text>
    <text x="447" y="368">整理材料</text>
    <text x="713" y="368">比较差异</text>
    <text x="980" y="368">形成判断</text>
  </g>
  <g font-family="Consolas, monospace" font-size="15" fill="#6f6a63" text-anchor="middle">
    <text x="180" y="398">FRAME</text>
    <text x="447" y="398">COLLECT</text>
    <text x="713" y="398">COMPARE</text>
    <text x="980" y="398">READ</text>
  </g>
  <g font-family="'Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#6f6a63">
    <text x="60" y="566">合成示意图 · 仅用于模板验证 · 不代表真实研究</text>
  </g>
</svg>
