  <line x1="170" y1="470" x2="1010" y2="180" stroke="#ee8b3e" stroke-width="2" stroke-dasharray="7 7"/>
  <g fill="#565049">
    <circle cx="200" cy="452" r="9"/><circle cx="270" cy="438" r="9"/><circle cx="330" cy="430" r="9"/>
    <circle cx="410" cy="392" r="9"/><circle cx="470" cy="386" r="9"/><circle cx="540" cy="352" r="9"/>
