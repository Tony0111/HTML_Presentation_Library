<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-label="合成示例柱状图，三个类别数值为 62、74、86 任意单位">
  <rect width="1160" height="620" fill="#f3fbf7"/>
  <g font-family="Georgia, 'Noto Serif SC', serif">
    <text x="60" y="60" font-size="26" font-style="italic" fill="#ee8b3e">ILLUSTRATIVE DATA / BAR</text>
    <text x="60" y="98" font-size="17" font-family="'Source Han Sans SC','Microsoft YaHei',sans-serif" fill="#5d8580">数值轴从零开始　单位：任意单位 a.u.</text>
  </g>
  <g stroke="#b8d8cf" stroke-width="1">
    <line x1="120" y1="160" x2="1040" y2="160"/><line x1="120" y1="280" x2="1040" y2="280"/>
    <line x1="120" y1="400" x2="1040" y2="400"/>
  </g>
  <line x1="120" y1="500" x2="1040" y2="500" stroke="#123f40" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="15" fill="#5d8580" text-anchor="end">
    <text x="108" y="166">30</text><text x="108" y="286">20</text><text x="108" y="406">10</text><text x="108" y="506">0</text>
  </g>
  <g>
    <rect x="200" y="352" width="180" height="148" fill="#8a847c"/>
    <rect x="490" y="316" width="180" height="184" fill="#565049"/>
    <rect x="780" y="272" width="180" height="228" fill="#ee8b3e"/>
  </g>
  <g font-family="Georgia, serif" font-size="24" text-anchor="middle" fill="#123f40">
    <text x="290" y="332">62</text><text x="580" y="296">74</text><text x="870" y="252" fill="#ee8b3e">86</text>
  </g>
  <g font-family="'Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="22" fill="#123f40" text-anchor="middle">
    <text x="290" y="540">方法 A</text><text x="580" y="540">方法 B</text><text x="870" y="540">方法 C</text>
  </g>
  <g font-family="'Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#5d8580">
    <text x="120" y="586">合成示例数据 · 不代表实验结果 · 单位为 a.u.</text>
  </g>
</svg>
