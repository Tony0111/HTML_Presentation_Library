<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WebGL probe</title>
<style>
  html,body{margin:0;background:#0b0b0e;color:#eee;font:14px/1.5 monospace}
  #info{position:fixed;left:12px;top:12px;z-index:2;white-space:pre}
  canvas{display:block}
</style>
</head>
<body>
<div id="info">booting…</div>
<canvas id="c" width="800" height="450"></canvas>
<script>
const info = document.getElementById('info');
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2') || cv.getContext('webgl');

function line(s){ info.textContent += '\n' + s; }

if (!gl) {
  info.textContent = 'NO WEBGL CONTEXT';
} else {
  info.textContent = 'context: ' + (gl instanceof WebGL2RenderingContext ? 'webgl2' : 'webgl');
  try {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    line('renderer: ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
    line('vendor: '   + (dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)   : gl.getParameter(gl.VENDOR)));
  } catch (e) { line('info ext failed: ' + e.message); }
  try {
    line('max texture: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
    line('float linear: ' + !!gl.getExtension('OES_texture_float_linear'));
    line('extensions: ' + (gl.getSupportedExtensions() || []).length);
  } catch (e) { line('param fail: ' + e.message); }

  // actually render something so we can tell real output from a blank page
  const vs = `attribute vec2 p; varying vec2 uv;
    void main(){ uv = p*0.5+0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
  const fs = `precision mediump float; varying vec2 uv; uniform float t;
    void main(){
      vec3 a = vec3(0.05,0.06,0.07);
      vec3 b = vec3(0.00,0.90,1.00);
      vec3 c = vec3(1.00,0.42,0.42);
      vec2 q = uv - 0.5;
      float r = length(q) - 0.18 - 0.02*sin(t*3.0);
      float band = smoothstep(0.012, 0.0, abs(r));
      vec3 col = mix(a, b, band);
      col = mix(col, c, smoothstep(0.20, 0.10, length(q - vec2(0.26,0.26))));
      gl_FragColor = vec4(col, 1.0);
    }`;
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) line('shader err: ' + gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tLoc = gl.getUniformLocation(prog, 't');
  let n = 0;
  (function frame(){
    gl.uniform1f(tLoc, n / 60);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (n++ < 90) requestAnimationFrame(frame);
    else line('frames drawn: ' + n);
  })();
}
</script>
</body>
</html>
