<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid background demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #f7f7f5; font-family: Georgia, "Songti SC", serif; }
  main { position: relative; z-index: 1; display: grid; place-content: center; height: 100%; padding: 0 8vw; }
  h1 { margin: 0; font-size: clamp(48px, 9vw, 140px); font-weight: 500; letter-spacing: 0; line-height: .95; }
  p { margin: 18px 0 0; font: 12px ui-monospace, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
</style>
</head>
<body>
<main>
  <h1>Move the<br><em>pointer.</em></h1>
  <p>Hover: a smooth lens bulge under the pointer / nothing else moves</p>
</main>
<script src="liquid-background.js"></script>
<script>
  window.bg = LiquidBackground({ colors: ["#05070b", "#12304a", "#2e7c6b", "#f0b27a"] });
</script>
</body>
</html>
